name: desktop-release

on:
  push:
    branches: [main]
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - windows-latest
          - macos-latest
    defaults:
      run:
        working-directory: vite-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Windows x64 NSIS
        if: runner.os == 'Windows'
        env:
          # 未配置 Secret 时为空字符串，electron-builder 会自动跳过签名
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run dist:desktop -- --win nsis --x64

      - name: Build macOS DMG (Intel + Apple Silicon)
        if: runner.os == 'macOS'
        run: npm run dist:desktop -- --mac dmg --x64 --arm64

      - name: Upload Windows EXE
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: vite-frontend/release/*.exe
          if-no-files-found: error

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: vite-frontend/release/*.dmg
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: vite-frontend
        run: npm ci --legacy-peer-deps

      # Android WebView 与桌面端同为 file:// 加载，复用 desktop 构建
      # （相对资源路径 + HashRouter）；前端运行时通过 window.JsInterface 识别 Android
      - name: Build frontend for Android WebView
        working-directory: vite-frontend
        run: npm run build:desktop

      - name: Copy frontend into Android assets
        run: |
          mkdir -p android-app/app/src/main/assets
          cp -r vite-frontend/dist/. android-app/app/src/main/assets/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0"

      # 仓库未提交 gradle-wrapper.jar，使用 setup-gradle 提供的 Gradle 8.2.1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      # 未提供 keystore 时构建 debug 包（自动用 debug 证书签名，可直接安装）
      - name: Build debug APK
        if: env.KEYSTORE_BASE64 == ''
        working-directory: android-app
        run: gradle assembleDebug --no-daemon -PversionCode=$((GITHUB_RUN_NUMBER + 1000)) -PversionName=1.0.$GITHUB_RUN_NUMBER

      - name: Build release APK
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android-app
        run: gradle assembleRelease --no-daemon -PversionCode=$((GITHUB_RUN_NUMBER + 1000)) -PversionName=1.0.$GITHUB_RUN_NUMBER

      # 用固定证书签名：同一证书 + 递增 versionCode = 可覆盖升级
      - name: Sign release APK with fixed keystore
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android-app
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/tms.pfx
          keytool -importkeystore -noprompt \
            -srckeystore /tmp/tms.pfx -srcstoretype PKCS12 -srcstorepass "$KEYSTORE_PASSWORD" \
            -destkeystore /tmp/tms.jks -deststoretype JKS \
            -deststorepass "$KEYSTORE_PASSWORD" -destkeypass "$KEYSTORE_PASSWORD" \
            -destalias tms
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          UNSIGNED=$(ls app/build/outputs/apk/release/*-unsigned.apk)
          "$APKSIGNER" sign \
            --ks /tmp/tms.jks --ks-type JKS --ks-key-alias tms \
            --ks-pass pass:"$KEYSTORE_PASSWORD" --key-pass pass:"$KEYSTORE_PASSWORD" \
            --out app/build/outputs/apk/release/app-release.apk \
            "$UNSIGNED"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: desktop-android
          path: |
            android-app/app/build/outputs/apk/**/*.apk
            !android-app/app/build/outputs/apk/**/*-unsigned.apk
          if-no-files-found: error

  release:
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve release tag
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=desktop-auto-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release with desktop assets
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          draft: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.apk

      - name: Publish release without marking latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method PATCH
          "repos/${{ github.repository }}/releases/${{ steps.create-release.outputs.id }}"
          -F draft=false
          -f make_latest=false
