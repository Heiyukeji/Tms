name: release-gost

# 合体面板节点端:构建 hybrid gost(带 sing-box 支持)并发布成 release 资产,
# 让新节点用 install.sh 一键装就自带协议能力。
# 触发:推送 gost-v* 标签(不抢全局 latest,latest 留给桌面自动发布)。
#   git tag gost-v1 && git push origin gost-v1
# 发布策略:在 gost-v* 上建历史版本 release;同时维护固定指针 tag gost-latest
#   及其 release(覆盖资产),install.sh 固定从 gost-latest 下载,与桌面 latest 隔离。

on:
  push:
    tags:
      - 'gost-v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go-gost/go.mod

      - name: Build hybrid gost (amd64 + arm64)
        working-directory: go-gost
        run: |
          mkdir -p ../dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=mod -trimpath -ldflags "-s -w" -o ../dist/gost-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -mod=mod -trimpath -ldflags "-s -w" -o ../dist/gost-arm64 .
          cp ../install.sh ../dist/install.sh
          ls -la ../dist

      # 先发 draft:先建 release 再传 asset,传完再放出来,避免 404 窗口。
      # make_latest=false:不抢全局 latest(latest 留给桌面自动发布)。
      - name: Publish versioned release (draft, not latest)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          make_latest: "false"
          files: |
            dist/gost-amd64
            dist/gost-arm64
            dist/install.sh
          body: |
            合体面板节点端 hybrid gost(内置 sing-box 下发/协议支持)。
            新节点安装:
            `curl -L https://github.com/Heiyukeji/Tms/releases/download/gost-latest/install.sh -o install.sh && chmod +x install.sh && ./install.sh -a http://面板IP:6365 -s 节点密钥`

      # asset 全部就位后才真正发布(不置 latest,latest 留给桌面自动发布)
      - name: Flip draft to published
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest=false

      # 维护固定指针 gost-latest:install.sh 固定从这里下载,与桌面 latest 隔离。
      # 每次发版都把 gost-latest tag 移到当前 commit,并覆盖其 release 资产。
      - name: Update gost-latest pointer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh api --method POST "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/gost-latest" -f sha="${GITHUB_SHA}" \
            || gh api --method PATCH "repos/${{ github.repository }}/git/refs/tags/gost-latest" \
               -f sha="${GITHUB_SHA}" -F force=true
          if gh release view gost-latest >/dev/null 2>&1; then
            gh release upload gost-latest dist/gost-amd64 dist/gost-arm64 dist/install.sh --clobber
            gh release edit gost-latest --draft=false --latest=false --target "${GITHUB_SHA}"
          else
            gh release create gost-latest \
              dist/gost-amd64 dist/gost-arm64 dist/install.sh \
              --title "gost-latest" \
              --notes "Latest hybrid gost build (auto-updated pointer; install.sh downloads from here)." \
              --target "${GITHUB_SHA}" \
              --latest=false
          fi
