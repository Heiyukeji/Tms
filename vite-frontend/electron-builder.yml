appId: com.heiyukeji.tms
productName: TMS
asar: true

directories:
  output: release

files:
  - dist/**/*
  - electron/**/*
  - package.json

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

mac:
  icon: build/icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
